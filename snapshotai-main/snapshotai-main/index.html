<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapShotAI Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-family: Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #overlay {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid white;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            text-align: center;
        }
        #content {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body onkeydown="handleKey(event)">
    <div id="overlay" onmousedown="startDrag(event)" onmousemove="drag(event)" onmouseup="stopDrag()">
        <div id="content">
            <h2>SnapShotAI Overlay</h2>
            <p>Press Ctrl+Alt+C to toggle visibility</p>
            <p>Drag to move</p>
            <button onclick="captureScreen()">Capture Screen</button>
            <button onclick="toggleVisibility()">Toggle</button>
        </div>
    </div>

    <script>
        let isDragging = false;
        let startX, startY, initialX, initialY;
        let isVisible = true;

        function startDrag(e) {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialX = parseInt(window.getComputedStyle(overlay).left) || 0;
            initialY = parseInt(window.getComputedStyle(overlay).top) || 0;
        }

        function drag(e) {
            if (isDragging) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                overlay.style.left = (initialX + dx) + 'px';
                overlay.style.top = (initialY + dy) + 'px';
            }
        }

        function stopDrag() {
            isDragging = false;
        }

        function handleKey(e) {
            if (e.ctrlKey && e.altKey && e.keyCode === 67) { // Ctrl+Alt+C
                toggleVisibility();
            }
        }

        function toggleVisibility() {
            isVisible = !isVisible;
            overlay.style.display = isVisible ? 'block' : 'none';
            logAction('toggle_visibility');
        }

        function captureScreen() {
            // Placeholder for screen capture
            alert('Screen capture functionality would go here');
            logAction('capture_screen');
        }

        function logAction(action) {
            const logEntry = { action, timestamp: new Date().toISOString() };
            let logs = JSON.parse(localStorage.getItem('telemetry') || '[]');
            logs.push(logEntry);
            localStorage.setItem('telemetry', JSON.stringify(logs));
            // Also save to file if possible, but localStorage is used here
        }

        // Initial log
        logAction('overlay_loaded');

        // Make semi-transparent and always-on-top (limited in browser)
        document.body.style.position = 'fixed';
    </script>
</body>
</html></content>
